<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ACG</title>
    <link rel="icon" href="icon.jpeg">
    <link rel="stylesheet" href="res/style.css">
    <style>
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            margin: 0;
            padding: 0;
        }

        .acg-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            cursor: pointer;
        }

        .acg-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .acg-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: var(--text-sm);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .acg-container:hover .acg-hint {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="acg-container" id="fullscreen">
        <img id="mainImage" alt="ACG图片">
        <div class="acg-hint"></div>
    </div>

    <script>
        const API_URL = 'https://loliapi.com/acg';
        const img = document.getElementById('mainImage');
        
        function loadImage() {
            const url = `${API_URL}?t=${Date.now()}`;
            img.src = url;
        }
        
        document.addEventListener('click', function() {
            loadImage();
        });
        
        loadImage();
    </script>
</body>
</html>
