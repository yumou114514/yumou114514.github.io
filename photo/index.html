<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片 - 羽某博客</title>
    <link rel="icon" href="../icon.jpeg">
    <link rel="stylesheet" href="../res/style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="navbar">
        <div class="container">
            <nav class="nav-links">
                <a href="../index.html">首页</a>
                <a href="../project/index.html">项目</a>
                <a href="../app/index.html">应用</a>
                <a href="#" class="active">照片</a>
                <a href="../article/index.html">文章</a>
                <a href="../ai.html">AI</a>
            </nav>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container">
        <h1>照片</h1>
        <div class="gallery-grid" id="galleryGrid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在加载照片...</p>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        © 2026 羽某博客 · 点击图片下载
    </footer>

    <script>
        async function loadGallery() {
            try {
                const response = await fetch('data.json');
                const items = await response.json();
                
                const grid = document.getElementById('galleryGrid');
                grid.innerHTML = items.map(item => renderCard(item)).join('');
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('galleryGrid').innerHTML = 
                    '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>加载失败，请稍后重试</p></div>';
            }
        }

        function renderCard(item) {
            if (item.type === 'image') {
                return `
                    <div class="gallery-card" onclick="downloadImage('${item.imgUrl}', '${item.fileName || getFileNameFromUrl(item.imgUrl)}')">
                        <img class="gallery-media" src="${item.imgUrl}" alt="${item.title || '图片'}">
                    </div>
                `;
            } else if (item.type === 'video') {
                const videoUrl = item.videoUrl || item.openLink || item.videoWatchUrl;
                return `
                    <div class="gallery-card" onclick="window.open('${videoUrl}', '_blank')">
                        <div class="gallery-placeholder">🔗 视频链接</div>
                    </div>
                `;
            }
            return '';
        }

        function getFileNameFromUrl(url) {
            try {
                const segments = url.split('/');
                let filename = segments.pop() || 'image';
                if (!filename.includes('.')) filename += '.jpg';
                return filename;
            } catch {
                return 'image.jpg';
            }
        }

        function downloadImage(url, fileName) {
            fetch(url)
                .then(response => response.blob())
                .then(blob => {
                    const link = document.createElement('a');
                    const objectUrl = URL.createObjectURL(blob);
                    link.href = objectUrl;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(objectUrl);
                })
                .catch(() => {
                    window.open(url, '_blank');
                });
        }

        loadGallery();
    </script>
</body>
</html>
