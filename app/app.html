<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用信息 - CB应用商店</title>
    <link rel="icon" href="../icon.jpeg">
    <link rel="stylesheet" href="../res/style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="navbar">
        <div class="container">
            <nav class="nav-links">
                <a href="index.html">← 返回应用商店</a>
                <span id="title-app-name" style="color: var(--color-primary); font-weight: 500;">应用信息</span>
            </nav>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="container">
        <!-- 应用基本信息卡片 -->
        <div class="app-detail-card">
            <div class="app-detail-icon" id="app-icon">
                <div>应用图标</div>
            </div>
            <div class="app-detail-info">
                <h1 id="app-name">名称</h1>
                <p id="app-author" style="color: var(--color-secondary); margin-bottom: var(--space-3);">作者:</p>
                <span class="app-version-badge" id="app-version">版本:</span>
                
                <div class="app-platforms" id="platforms-container" style="margin-top: var(--space-4);">
                    <!-- 平台标签会动态生成 -->
                </div>
            </div>
        </div>

        <!-- 详细信息区域 -->
        <div class="detail-section">
            <div class="detail-card">
                <h2>开发者信息</h2>
                <div class="info-item">
                    <div class="info-label">开发者网站</div>
                    <div class="info-value" id="author-website">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">项目地址</div>
                    <div class="info-value" id="project-website">-</div>
                </div>
            </div>
        </div>

        <!-- 下载区域 -->
        <div class="download-section">
            <h2>下载应用</h2>
            <div class="download-buttons" id="download-buttons">
                <!-- 下载按钮会动态生成 -->
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        © 2026 CB应用商店
    </footer>

    <script>
        // 从URL参数中获取应用信息
        function getAppNameFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('app') || 'Timer';
        }
        
        function getAppPathFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('path') || 'Timer';
        }
        
        // 加载应用信息
        async function loadAppInfo() {
            const appName = getAppNameFromURL();
            const appPath = getAppPathFromURL();
            
            document.getElementById('app-name').textContent = '加载中...';
            document.getElementById('app-author').textContent = '作者：加载中...';
            document.getElementById('app-version').textContent = '版本：加载中';
            document.getElementById('title-app-name').textContent = '正在加载应用信息...';
            
            try {
                const response = await fetch(`${appPath}/info.json`);
                
                if (!response.ok) {
                    throw new Error(`无法加载应用信息: ${response.status}`);
                }
                
                const appInfo = await response.json();
                updateAppInfoDisplay(appInfo, appPath);
                loadAppIcon(appPath);
                
            } catch (error) {
                console.error('加载应用信息时出错:', error);
                showError(`加载应用信息失败: ${error.message}`);
            }
        }
        
        // 更新应用信息显示
        function updateAppInfoDisplay(appInfo, appPath) {
            document.getElementById('title-app-name').textContent = appInfo.name;
            document.getElementById('app-name').textContent = appInfo.name;
            document.getElementById('app-author').textContent = `作者：${appInfo.author}`;
            document.getElementById('app-version').textContent = `版本 ${appInfo.Version}`;
            
            const platformsContainer = document.getElementById('platforms-container');
            platformsContainer.innerHTML = '';
            
            appInfo.platforms.forEach(platform => {
                const platformTag = document.createElement('span');
                platformTag.className = 'platform-tag';
                platformTag.textContent = platform;
                platformsContainer.appendChild(platformTag);
            });
            
            const authorWebsite = document.getElementById('author-website');
            const projectWebsite = document.getElementById('project-website');
            
            if (appInfo.Websites && appInfo.Websites.Auhtor) {
                authorWebsite.innerHTML = `<a href="https://${appInfo.Websites.Auhtor}" target="_blank">${appInfo.Websites.Auhtor}</a>`;
            } else {
                authorWebsite.textContent = '无';
            }
            
            if (appInfo.Websites && appInfo.Websites.Project) {
                projectWebsite.innerHTML = `<a href="https://${appInfo.Websites.Project}" target="_blank">${appInfo.Websites.Project}</a>`;
            } else {
                projectWebsite.textContent = '无';
            }
            
            updateDownloadButtons(appInfo, appPath);
            document.title = `${appInfo.name} - CB应用商店`;
        }
        
        // 加载应用图标
        async function loadAppIcon(appPath) {
            try {
                const iconUrl = `${appPath}/icon.png`;
                const response = await fetch(iconUrl);
                
                if (response.ok) {
                    const appIcon = document.getElementById('app-icon');
                    appIcon.innerHTML = `<img src="${iconUrl}" alt="应用图标" onerror="useDefaultIcon()" />`;
                } else {
                    useDefaultIcon();
                }
            } catch (error) {
                console.log('无法加载应用图标');
                useDefaultIcon();
            }
        }
        
        // 使用默认图标
        function useDefaultIcon() {
            const appIcon = document.getElementById('app-icon');
            const appName = document.getElementById('app-name').textContent;
            const firstChar = appName.charAt(0).toUpperCase();
            
            if (appName !== '加载中...') {
                appIcon.innerHTML = `<div>${firstChar}</div>`;
            }
        }
        
        // 更新下载按钮
        function updateDownloadButtons(appInfo, appPath) {
            const downloadButtons = document.getElementById('download-buttons');
            downloadButtons.innerHTML = '';
            
            if (appInfo.platforms && appInfo.platforms.length > 0) {
                appInfo.platforms.forEach(platform => {
                    const downloadBtn = document.createElement('a');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.href = '#';
                    downloadBtn.innerHTML = `
                        <div class="platform-name">${platform}</div>
                        <div class="platform-desc">下载 ${platform} 版本</div>
                    `;
                    downloadButtons.appendChild(downloadBtn);
                });
            }
        }
        
        // 显示错误信息
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `<strong>错误：</strong>${message}`;
            
            const mainContent = document.querySelector('.container');
            mainContent.insertBefore(errorDiv, mainContent.firstChild);
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', loadAppInfo);
    </script>
</body>
</html>
