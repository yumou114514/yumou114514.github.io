<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CB应用商店 - 羽某博客</title>
    <link rel="icon" href="../icon.jpeg">
    <link rel="stylesheet" href="../res/style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="navbar">
        <div class="container">
            <nav class="nav-links">
                <a href="../index.html">首页</a>
                <a href="../project/index.html">项目</a>
                <a href="#" class="active">应用</a>
                <a href="../photo/index.html">照片</a>
                <a href="../article/index.html">文章</a>
                <a href="../ai.html">AI</a>
            </nav>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="container">
        <!-- 应用头部 -->
        <div class="app-header">
            <div class="app-header-content">
                <div class="app-logo-icon">CB</div>
                <div class="app-logo-text">
                    <h1>CB应用商店</h1>
                    <p>发现和使用优质应用</p>
                </div>
            </div>
        </div>

        <!-- 搜索框 -->
        <div class="app-search">
            <input type="text" id="search-input" placeholder="搜索应用名称或描述..." autocomplete="off">
        </div>

        <!-- 视图切换 -->
        <div class="app-section-header">
            <h2 id="section-title">全部应用 <span class="app-count" id="app-count">0</span></h2>
            <div class="view-toggle">
                <button id="view-all" class="active">全部</button>
                <button id="view-letters">按字母</button>
            </div>
        </div>

        <!-- 全部应用列表 -->
        <div id="all-apps-section">
            <div class="apps-grid" id="all-apps-grid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载应用列表...</p>
                </div>
            </div>
        </div>

        <!-- 字母导航区域 -->
        <div id="letters-section" style="display: none;">
            <div class="letters-grid" id="letters-grid">
                <!-- 字母按钮会动态生成 -->
            </div>
        </div>

        <!-- 按字母筛选的应用列表 -->
        <div id="filtered-apps-section" style="display: none;">
            <div class="flex gap-4 mb-6" style="align-items: center; justify-content: space-between;">
                <button class="btn btn-outline" id="back-to-letters">
                    ← 返回字母
                </button>
                <h2 id="current-letter" style="margin: 0;">A</h2>
            </div>
            
            <div class="apps-grid" id="filtered-apps-grid">
                <!-- 应用卡片会动态生成 -->
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        © 2026 CB应用商店
    </footer>

    <script>
    // 全局状态
    let allAppsData = [];
    let currentView = 'all'; // 'all', 'letters', 'filtered'

    // 初始化页面
    async function initPage() {
        await loadAllApps();
        initLetters();
        initEventListeners();
        renderAllApps();
    }

    // 加载所有应用数据
    async function loadAllApps() {
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const promises = letters.map(async letter => {
            try {
                const response = await fetch(`ProjectList/${letter.toLowerCase()}.json`);
                if (!response.ok) return [];
                const data = await response.json();
                return data.apps || [];
            } catch (error) {
                return [];
            }
        });

        const results = await Promise.all(promises);
        allAppsData = results.flat();
    }

    // 初始化字母网格
    function initLetters() {
        const lettersGrid = document.getElementById('letters-grid');
        lettersGrid.innerHTML = '';
        
        const lettersWithApps = new Set();
        allAppsData.forEach(app => {
            const firstChar = app.name.charAt(0).toUpperCase();
            lettersWithApps.add(firstChar);
        });

        for (let i = 65; i <= 90; i++) {
            const letter = String.fromCharCode(i);
            const letterBtn = document.createElement('button');
            letterBtn.className = 'letter-btn';
            if (lettersWithApps.has(letter)) {
                letterBtn.classList.add('has-apps');
            }
            letterBtn.textContent = letter;
            letterBtn.dataset.letter = letter;
            
            letterBtn.addEventListener('click', function() {
                filterAppsByLetter(letter);
            });
            
            lettersGrid.appendChild(letterBtn);
        }
    }

    // 渲染全部应用
    function renderAllApps() {
        const grid = document.getElementById('all-apps-grid');
        const countEl = document.getElementById('app-count');
        
        if (allAppsData.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📦</div>
                    <p>暂无应用</p>
                </div>
            `;
            countEl.textContent = '0';
            return;
        }

        grid.innerHTML = '';
        allAppsData.forEach(app => {
            const card = createAppCard(app);
            grid.appendChild(card);
        });
        countEl.textContent = allAppsData.length;
    }

    // 按字母筛选应用
    function filterAppsByLetter(letter) {
        const filteredApps = allAppsData.filter(app => 
            app.name.charAt(0).toUpperCase() === letter
        );

        const lettersSection = document.getElementById('letters-section');
        const filteredSection = document.getElementById('filtered-apps-section');
        const filteredGrid = document.getElementById('filtered-apps-grid');
        const currentLetterEl = document.getElementById('current-letter');

        lettersSection.style.display = 'none';
        filteredSection.style.display = 'block';
        currentLetterEl.textContent = letter;

        filteredGrid.innerHTML = '';
        if (filteredApps.length === 0) {
            filteredGrid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📁</div>
                    <p>没有找到以 "${letter}" 开头的应用</p>
                </div>
            `;
        } else {
            filteredApps.forEach(app => {
                const card = createAppCard(app);
                filteredGrid.appendChild(card);
            });
        }

        currentView = 'filtered';
    }

    // 创建应用卡片
    function createAppCard(appInfo) {
        const appCard = document.createElement('div');
        appCard.className = 'app-card';
        
        const iconContainer = document.createElement('div');
        iconContainer.className = 'app-icon-container';
        
        const icon = document.createElement('div');
        icon.className = 'app-icon';
        
        const iconImg = document.createElement('img');
        iconImg.src = `${appInfo.path}/icon.png?t=${Date.now()}`;
        iconImg.alt = `${appInfo.name} 图标`;
        iconImg.onerror = () => {
            icon.innerHTML = appInfo.name.charAt(0).toUpperCase();
            iconImg.style.display = 'none';
        };
        
        icon.appendChild(iconImg);
        iconContainer.appendChild(icon);
        
        const appInfoDiv = document.createElement('div');
        appInfoDiv.className = 'app-info';
        
        const name = document.createElement('div');
        name.className = 'app-name';
        name.textContent = appInfo.name;
        
        const description = document.createElement('div');
        description.className = 'app-card-desc';
        description.textContent = appInfo.description || '暂无描述';
        
        const author = document.createElement('div');
        author.className = 'app-author';
        author.textContent = appInfo.author || '未知作者';
        
        const platforms = document.createElement('div');
        platforms.className = 'app-platforms';
        
        if (appInfo.platforms && appInfo.platforms.length > 0) {
            appInfo.platforms.slice(0, 3).forEach(platform => {
                const platformTag = document.createElement('span');
                platformTag.className = 'platform-tag';
                platformTag.textContent = platform;
                platforms.appendChild(platformTag);
            });
        }
        
        appInfoDiv.appendChild(name);
        appInfoDiv.appendChild(description);
        appInfoDiv.appendChild(author);
        appInfoDiv.appendChild(platforms);
        
        appCard.appendChild(iconContainer);
        appCard.appendChild(appInfoDiv);
        
        appCard.addEventListener('click', () => {
            window.location.href = `app.html?app=${encodeURIComponent(appInfo.name)}&path=${encodeURIComponent(appInfo.path)}&t=${Date.now()}`;
        });
        
        return appCard;
    }

    // 搜索功能
    function handleSearch(query) {
        const grid = document.getElementById('all-apps-grid');
        const countEl = document.getElementById('app-count');
        
        if (!query.trim()) {
            renderAllApps();
            return;
        }

        const lowerQuery = query.toLowerCase();
        const filteredApps = allAppsData.filter(app => 
            app.name.toLowerCase().includes(lowerQuery) ||
            (app.description && app.description.toLowerCase().includes(lowerQuery)) ||
            (app.author && app.author.toLowerCase().includes(lowerQuery))
        );

        grid.innerHTML = '';
        if (filteredApps.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <p>没有找到匹配的应用</p>
                </div>
            `;
            countEl.textContent = '0';
        } else {
            filteredApps.forEach(app => {
                const card = createAppCard(app);
                grid.appendChild(card);
            });
            countEl.textContent = filteredApps.length;
        }
    }

    // 初始化事件监听
    function initEventListeners() {
        // 搜索框
        const searchInput = document.getElementById('search-input');
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                handleSearch(e.target.value);
            }, 300);
        });

        // 视图切换
        document.getElementById('view-all').addEventListener('click', function() {
            currentView = 'all';
            document.getElementById('all-apps-section').style.display = 'block';
            document.getElementById('letters-section').style.display = 'none';
            document.getElementById('filtered-apps-section').style.display = 'none';
            document.getElementById('section-title').innerHTML = `全部应用 <span class="app-count" id="app-count">${allAppsData.length}</span>`;
            this.classList.add('active');
            document.getElementById('view-letters').classList.remove('active');
            renderAllApps();
        });

        document.getElementById('view-letters').addEventListener('click', function() {
            currentView = 'letters';
            document.getElementById('all-apps-section').style.display = 'none';
            document.getElementById('letters-section').style.display = 'block';
            document.getElementById('filtered-apps-section').style.display = 'none';
            document.getElementById('section-title').innerHTML = '按字母浏览';
            this.classList.add('active');
            document.getElementById('view-all').classList.remove('active');
        });

        // 返回字母导航
        document.getElementById('back-to-letters').addEventListener('click', function() {
            document.getElementById('letters-section').style.display = 'block';
            document.getElementById('filtered-apps-section').style.display = 'none';
        });
    }

    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
