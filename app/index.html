<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CB应用商店 - 羽某博客</title>
    <link rel="icon" href="../icon.jpeg">
    <link rel="stylesheet" href="../res/style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="navbar">
        <div class="container">
            <nav class="nav-links">
                <a href="../index.html">首页</a>
                <a href="../project/index.html">项目</a>
                <a href="#" class="active">应用</a>
                <a href="../photo/index.html">照片</a>
                <a href="../article/index.html">文章</a>
                <a href="../ai.html">AI</a>
            </nav>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="container">
        <!-- 应用头部 -->
        <div class="app-header">
            <div class="app-header-content">
                <div class="app-logo-icon">CB</div>
                <div class="app-logo-text">
                    <h1>CB应用商店</h1>
                </div>
            </div>
        </div>

        <!-- 字母导航区域 -->
        <div id="letters-section">
            <h2>按字母浏览应用</h2>
            <div class="letters-grid" id="letters-grid">
                <!-- 字母按钮会动态生成 -->
            </div>
        </div>

        <!-- 应用列表区域 -->
        <div id="apps-section" style="display: none;">
            <div class="flex gap-4 mb-6" style="align-items: center; justify-content: space-between;">
                <button class="btn btn-outline" id="back-to-letters">
                    ← 返回导航
                </button>
                <h2 id="current-letter" style="margin: 0;">A</h2>
            </div>
            
            <div class="apps-grid" id="apps-grid">
                <!-- 应用卡片会动态生成 -->
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        © 2026 CB应用商店
    </footer>

    <script>
    // 字母映射表
    const letterMapping = {
        'A': 'a', 'B': 'b', 'C': 'c', 'D': 'd', 'E': 'e', 'F': 'f',
        'G': 'g', 'H': 'h', 'I': 'i', 'J': 'j', 'K': 'k', 'L': 'l',
        'M': 'm', 'N': 'n', 'O': 'o', 'P': 'p', 'Q': 'q', 'R': 'r',
        'S': 's', 'T': 't', 'U': 'u', 'V': 'v', 'W': 'w', 'X': 'x',
        'Y': 'y', 'Z': 'z'
    };

    // 初始化字母网格
    function initLetters() {
        const lettersGrid = document.getElementById('letters-grid');
        lettersGrid.innerHTML = '';
        
        for (let i = 65; i <= 90; i++) {
            const letter = String.fromCharCode(i);
            const letterBtn = document.createElement('button');
            letterBtn.className = 'letter-btn';
            letterBtn.textContent = letter;
            letterBtn.dataset.letter = letter;
            
            letterBtn.addEventListener('click', function() {
                const letterToLoad = this.dataset.letter;
                loadAppsByLetter(letterToLoad);
            });
            
            lettersGrid.appendChild(letterBtn);
        }
    }
    
    // 根据字母加载应用
    async function loadAppsByLetter(letter) {
        const lettersSection = document.getElementById('letters-section');
        const appsSection = document.getElementById('apps-section');
        const appsGrid = document.getElementById('apps-grid');
        const currentLetter = document.getElementById('current-letter');
        
        lettersSection.style.display = 'none';
        appsSection.style.display = 'block';
        currentLetter.textContent = letter;
        
        appsGrid.innerHTML = `
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在加载应用列表...</p>
            </div>
        `;
        
        try {
            const mappedLetter = letterMapping[letter] || letter.toLowerCase();
            const jsonPath = `ProjectList/${mappedLetter}.json`;
            
            const response = await fetch(`${jsonPath}?t=${Date.now()}`);
            
            if (!response.ok) {
                if (response.status === 404) {
                    showEmptyApps(letter);
                } else {
                    throw new Error(`加载失败: ${response.status}`);
                }
                return;
            }
            
            const data = await response.json();
            
            if (!data.apps || data.apps.length === 0) {
                showEmptyApps(letter);
                return;
            }
            
            appsGrid.innerHTML = '';
            
            const appPromises = data.apps.map(appName => 
                loadAppInfo(appName).then(appInfo => createAppCard(appInfo, appName))
            );
            
            const appCards = await Promise.allSettled(appPromises);
            
            appCards.forEach(result => {
                if (result.status === 'fulfilled' && result.value) {
                    appsGrid.appendChild(result.value);
                }
            });
            
            if (appsGrid.children.length === 0) {
                showEmptyApps(letter);
            }
            
        } catch (error) {
            console.error('加载应用列表时出错:', error);
            showError(`加载应用列表失败: ${error.message}`);
        }
    }
    
    // 加载单个应用信息
    async function loadAppInfo(appName) {
        try {
            const response = await fetch(`${appName}/info.json?t=${Date.now()}`);
            
            if (!response.ok) {
                throw new Error(`无法加载应用信息: ${response.status}`);
            }
            
            return await response.json();
        } catch (error) {
            console.error(`加载应用 ${appName} 信息失败:`, error);
            return {
                name: appName,
                author: '作者',
                platforms: []
            };
        }
    }
    
    // 创建应用卡片
    function createAppCard(appInfo, appName) {
        const appCard = document.createElement('div');
        appCard.className = 'app-card';
        
        const iconContainer = document.createElement('div');
        iconContainer.className = 'app-icon-container';
        
        const icon = document.createElement('div');
        icon.className = 'app-icon';
        
        const iconImg = document.createElement('img');
        iconImg.src = `${appName}/icon.png?t=${Date.now()}`;
        iconImg.alt = `${appInfo.name} 图标`;
        iconImg.onerror = () => {
            icon.innerHTML = appInfo.name.charAt(0).toUpperCase();
            iconImg.style.display = 'none';
        };
        
        icon.appendChild(iconImg);
        iconContainer.appendChild(icon);
        
        const appInfoDiv = document.createElement('div');
        appInfoDiv.className = 'app-info';
        
        const name = document.createElement('div');
        name.className = 'app-name';
        name.textContent = appInfo.name || appName;
        
        const author = document.createElement('div');
        author.className = 'app-author';
        author.textContent = appInfo.author || '未知作者';
        
        const platforms = document.createElement('div');
        platforms.className = 'app-platforms';
        
        if (appInfo.platforms && appInfo.platforms.length > 0) {
            appInfo.platforms.slice(0, 3).forEach(platform => {
                const platformTag = document.createElement('span');
                platformTag.className = 'platform-tag';
                platformTag.textContent = platform;
                platforms.appendChild(platformTag);
            });
        }
        
        appInfoDiv.appendChild(name);
        appInfoDiv.appendChild(author);
        appInfoDiv.appendChild(platforms);
        
        appCard.appendChild(iconContainer);
        appCard.appendChild(appInfoDiv);
        
        appCard.addEventListener('click', () => {
            window.location.href = `app.html?app=${encodeURIComponent(appInfo.name || appName)}&path=${encodeURIComponent(appName)}&t=${Date.now()}`;
        });
        
        return appCard;
    }
    
    // 显示空应用状态
    function showEmptyApps(letter) {
        const appsGrid = document.getElementById('apps-grid');
        appsGrid.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">📁</div>
                <p>没有找到以 "${letter}" 开头的应用</p>
                <p style="font-size: var(--text-sm); margin-top: var(--space-3);">该字母下暂无应用，试试其他字母</p>
            </div>
        `;
    }
    
    // 显示错误信息
    function showError(message) {
        const appsGrid = document.getElementById('apps-grid');
        appsGrid.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">⚠️</div>
                <p>${message}</p>
                <p style="font-size: var(--text-sm); margin-top: var(--space-3);">请检查网络连接或稍后再试</p>
            </div>
        `;
    }
    
    // 返回导航
    function goBackToLetters() {
        const lettersSection = document.getElementById('letters-section');
        const appsSection = document.getElementById('apps-section');
        
        lettersSection.style.display = 'block';
        appsSection.style.display = 'none';
    }
    
    // 初始化页面
    function initPage() {
        initLetters();
        document.getElementById('back-to-letters').addEventListener('click', goBackToLetters);
        
        const urlParams = new URLSearchParams(window.location.search);
        const initialLetter = urlParams.get('letter');
        
        if (initialLetter && /^[A-Za-z]$/.test(initialLetter)) {
            loadAppsByLetter(initialLetter.toUpperCase());
        }
    }
    
    document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
