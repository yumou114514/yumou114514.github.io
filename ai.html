<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
    <title>AI聊天 - 羽某博客</title>
    <link rel="icon" href="icon.jpeg">
    <link rel="stylesheet" href="res/style.css">
    <style>
        body {
            padding: 12px;
            margin: 0;
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, var(--color-accent), var(--color-accent-hover));
            color: white;
            padding: 12px 20px;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            box-shadow: var(--shadow-md);
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .chat-header h1 {
            font-size: var(--text-xl);
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
        }

        .chat-subtitle {
            font-size: var(--text-xs);
            opacity: 0.85;
        }

        .api-panel {
            background: rgba(255,255,255,0.15);
            border-radius: var(--radius-lg);
            padding: 8px 12px;
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            font-size: var(--text-sm);
        }

        .api-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            background: rgba(0,0,0,0.2);
            padding: 4px 10px;
            border-radius: 40px;
            transition: 0.2s;
        }

        .api-option.selected {
            background: #ffd966;
            color: #1e3c72;
            font-weight: bold;
        }

        .api-option input {
            margin: 0;
            cursor: pointer;
        }

        .user-key-input {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 2;
            min-width: 180px;
        }

        .user-key-input input {
            flex: 1;
            padding: 5px 10px;
            border-radius: 20px;
            border: none;
            outline: none;
            font-size: var(--text-xs);
            background: #f0f2f5;
        }

        .user-key-input button {
            background: #ffc107;
            border: none;
            border-radius: 20px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: var(--text-xs);
            font-weight: bold;
            color: #1e3c72;
        }

        .key-status {
            font-size: var(--text-xs);
            background: rgba(0,0,0,0.5);
            padding: 2px 8px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .chat-container {
            background-color: var(--color-bg);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .chat-message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            word-wrap: break-word;
            font-size: var(--text-sm);
            animation: fadeIn 0.2s ease;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--color-accent);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--color-bg-alt);
            color: var(--color-primary);
            border-bottom-left-radius: 2px;
        }

        .error-message {
            align-self: flex-start;
            background-color: #fee2e2;
            color: #c62828;
            border-left: 3px solid #c62828;
        }

        .message-header {
            font-size: var(--text-xs);
            font-weight: bold;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .input-area {
            display: flex;
            border-top: 1px solid var(--color-border);
            padding: 15px;
            background-color: var(--color-bg-alt);
        }

        #user-input {
            flex-grow: 1;
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: 20px;
            font-size: var(--text-sm);
            outline: none;
            transition: border 0.2s;
        }

        #user-input:focus {
            border-color: var(--color-accent);
        }

        #send-btn {
            background-color: var(--color-accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            margin-left: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            font-size: var(--text-sm);
        }

        #send-btn:hover:not(:disabled) {
            background-color: var(--color-accent-hover);
        }

        #send-btn:disabled {
            background-color: var(--color-muted);
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: var(--color-bg-alt);
            color: var(--color-secondary);
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            border-bottom-left-radius: 4px;
            margin-left: 15px;
            margin-bottom: 5px;
        }

        .typing-dots {
            display: flex;
            align-items: center;
        }

        .typing-dots span {
            height: 6px;
            width: 6px;
            background-color: var(--color-muted);
            border-radius: 50%;
            display: inline-block;
            margin: 0 1.5px;
            animation: typing 1.4s infinite both;
        }

        .typing-dots span:nth-child(1) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.4s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .ai-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #ffb347;
            color: #1e3c72;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: var(--text-sm);
        }

        .no-messages {
            text-align: center;
            color: var(--color-muted);
            font-style: italic;
            margin: auto;
            font-size: var(--text-sm);
        }

        .chat-code-block {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 8px;
            border-radius: var(--radius-md);
            overflow-x: auto;
            font-size: var(--text-xs);
            margin: 6px 0;
        }

        .chat-inline-code {
            font-family: monospace;
            background: var(--color-bg-alt);
            padding: 2px 4px;
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
        }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .api-panel { flex-direction: column; align-items: stretch; }
            .user-key-input { width: 100%; }
            .chat-message { max-width: 90%; }
        }
    </style>
</head>
<body>
    <header class="chat-header">
        <h1><span class="ai-icon">🔑</span> AI聊天</h1>
        <div class="api-panel" id="api-panel">
            <label class="api-option" id="opt-builtin">
                <input type="radio" name="apiMode" value="builtin" checked> 🔐 使用内置演示Key (限流/测试)
            </label>
            <label class="api-option" id="opt-custom">
                <input type="radio" name="apiMode" value="custom"> ✏️ 使用我自己的API Key
            </label>
            <div class="user-key-input" id="user-key-area" style="display: none;">
                <input type="password" id="custom-api-key" placeholder="sk-xxxxxxxxxxxxxxxx" autocomplete="off">
                <button id="save-key-btn">保存并生效</button>
            </div>
            <div class="key-status" id="key-status-text">⚙️ 未激活</div>
        </div>
    </header>

    <div class="chat-container">
        <div class="chat-history" id="chat-history">
            <div class="no-messages" id="no-messages">💬 选择API模式后即可开始对话<br>🔹 内置Key仅供体验，建议自备Key</div>
        </div>
        <div class="typing-indicator" id="typing-indicator">
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="输入消息，按 Enter 发送..." autocomplete="off" autofocus>
            <button id="send-btn">发送</button>
        </div>
    </div>

    <script>
        const BUILTIN_DEMO_KEY = 'sk-demo-deepseek-public-limited-do-not-use-in-production';
        const API_URL = 'https://api.deepseek.com/v1/chat/completions';
        const MODEL_NAME = 'deepseek-chat';

        let currentApiKey = '';
        let apiMode = 'builtin';
        let isWaitingResponse = false;
        let conversationHistory = [];

        const SYSTEM_PROMPT = {
            role: 'system',
            content: '你是 DeepSeek AI 助手，由深度求索公司创造。请用友好、专业、清晰的中文回答问题，帮助用户解决疑问。'
        };

        const chatHistoryDiv = document.getElementById('chat-history');
        const noMessagesDiv = document.getElementById('no-messages');
        const typingIndicator = document.getElementById('typing-indicator');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const keyStatusSpan = document.getElementById('key-status-text');
        const optBuiltin = document.getElementById('opt-builtin');
        const optCustom = document.getElementById('opt-custom');
        const userKeyArea = document.getElementById('user-key-area');
        const customKeyInput = document.getElementById('custom-api-key');
        const saveKeyBtn = document.getElementById('save-key-btn');

        function updateKeyStatus(message, isError = false) {
            keyStatusSpan.textContent = message;
            keyStatusSpan.style.backgroundColor = isError ? '#d32f2f' : 'rgba(0,0,0,0.6)';
            keyStatusSpan.style.color = 'white';
        }

        function removePlaceholder() {
            if (noMessagesDiv && noMessagesDiv.style.display !== 'none') {
                noMessagesDiv.style.display = 'none';
            }
        }

        function addMessageToChat(sender, message, isError = false) {
            removePlaceholder();
            const messageDiv = document.createElement('div');
            if (isError) {
                messageDiv.className = 'chat-message error-message';
            } else {
                messageDiv.className = `chat-message ${sender}-message`;
            }

            const header = document.createElement('div');
            header.className = 'message-header';
            if (sender === 'user') header.textContent = '您';
            else if (sender === 'ai') header.textContent = 'DeepSeek AI';
            else header.textContent = '系统提示';

            const contentDiv = document.createElement('div');
            if (sender === 'ai' && !isError) {
                let formatted = escapeHtml(message).replace(/\n/g, '<br>');
                formatted = formatted.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre class="chat-code-block"><code>$2</code></pre>');
                contentDiv.innerHTML = formatted;
            } else {
                contentDiv.textContent = message;
            }

            messageDiv.appendChild(header);
            messageDiv.appendChild(contentDiv);
            chatHistoryDiv.appendChild(messageDiv);
            chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
            return messageDiv;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function resetConversationHistory() {
            conversationHistory = [];
        }

        function getEffectiveApiKey() {
            if (apiMode === 'builtin') {
                return BUILTIN_DEMO_KEY;
            } else {
                const userKey = customKeyInput.value.trim();
                return userKey || '';
            }
        }

        function refreshApiStatus() {
            const key = getEffectiveApiKey();
            if (apiMode === 'builtin') {
                updateKeyStatus('🔑 内置演示模式 (有限速)');
            } else {
                if (key && key.length > 5) {
                    updateKeyStatus(`✅ 用户自定义Key (${key.slice(0, 8)}...)`);
                } else {
                    updateKeyStatus('⚠️ 未填写自定义Key，请输入有效的DeepSeek Key', true);
                }
            }
        }

        function applyCustomKey() {
            const newKey = customKeyInput.value.trim();
            if (!newKey) {
                updateKeyStatus('❌ 请输入API Key再保存', true);
                return false;
            }
            document.querySelector('input[value="custom"]').checked = true;
            apiMode = 'custom';
            currentApiKey = newKey;
            try {
                localStorage.setItem('deepseek_user_key', newKey);
            } catch (e) { }
            refreshApiStatus();
            addMessageToChat('system', '🔑 已切换至您的API Key，后续对话将使用您自己的密钥。', false);
            return true;
        }

        function loadStoredKey() {
            try {
                const saved = localStorage.getItem('deepseek_user_key');
                if (saved && saved.trim()) {
                    customKeyInput.value = saved;
                }
            } catch (e) { }
        }

        async function callDeepSeekAPI(userMessage) {
            const activeKey = getEffectiveApiKey();
            if (!activeKey || activeKey === 'sk-demo-deepseek-public-limited-do-not-use-in-production') {
                if (apiMode === 'builtin') {
                    throw new Error('当前使用公开演示Key，可能已被限流或失效。请切换到"使用我自己的API Key"并填入有效的DeepSeek Key。');
                } else {
                    throw new Error('API Key 无效，请检查您的DeepSeek Key是否正确填写。');
                }
            }

            conversationHistory.push({ role: 'user', content: userMessage });
            const messages = [SYSTEM_PROMPT, ...conversationHistory];

            const requestBody = {
                model: MODEL_NAME,
                messages: messages,
                temperature: 0.7,
                max_tokens: 2048,
                stream: false
            };

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${activeKey}`
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                let errorDetail = `HTTP ${response.status}`;
                try {
                    const errData = await response.json();
                    errorDetail = errData.error?.message || JSON.stringify(errData);
                } catch (e) { }
                throw new Error(`${response.status}: ${errorDetail}`);
            }

            const data = await response.json();
            if (!data.choices || data.choices.length === 0) {
                throw new Error('API响应格式错误');
            }
            const aiReply = data.choices[0].message.content;
            conversationHistory.push({ role: 'assistant', content: aiReply });

            if (conversationHistory.length > 16) {
                conversationHistory = conversationHistory.slice(-14);
            }
            return aiReply;
        }

        async function handleSendMessage() {
            if (isWaitingResponse) return;
            const message = userInput.value.trim();
            if (!message) {
                userInput.focus();
                return;
            }

            const currentKey = getEffectiveApiKey();
            if (!currentKey || (apiMode === 'custom' && !currentKey.startsWith('sk-') && currentKey.length < 15)) {
                let errMsg = '请先配置API Key: ';
                if (apiMode === 'custom') {
                    errMsg += '在下方输入框填写您的DeepSeek Key并点击"保存并生效"。';
                } else {
                    errMsg += '内置演示Key不可用，建议切换到自定义模式并填入您自己的Key (免费获取: platform.deepseek.com)。';
                }
                addMessageToChat('system', errMsg, true);
                return;
            }

            sendBtn.disabled = true;
            isWaitingResponse = true;
            addMessageToChat('user', message);
            userInput.value = '';
            typingIndicator.style.display = 'block';
            chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;

            try {
                const aiResponse = await callDeepSeekAPI(message);
                typingIndicator.style.display = 'none';
                addMessageToChat('ai', aiResponse);
                refreshApiStatus();
            } catch (error) {
                typingIndicator.style.display = 'none';
                let userFriendlyError = `请求失败: ${error.message}`;
                if (error.message.includes('401') || error.message.includes('Authentication')) {
                    userFriendlyError = '🔐 API Key 认证失败，请检查Key是否正确';
                    if (apiMode === 'builtin') userFriendlyError += '。内置Key可能已过期，请切换自定义模式。';
                } else if (error.message.includes('429')) {
                    userFriendlyError = '⏱️ 请求频率超限，请稍后再试，或使用自己的Key获得更高限制。';
                } else if (error.message.includes('fetch')) {
                    userFriendlyError = '🌐 网络错误，无法连接DeepSeek API。';
                }
                addMessageToChat('ai', `❌ ${userFriendlyError}`, true);
                refreshApiStatus();
            } finally {
                sendBtn.disabled = false;
                isWaitingResponse = false;
                userInput.focus();
                chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
            }
        }

        function switchApiMode(mode) {
            apiMode = mode;
            if (mode === 'builtin') {
                userKeyArea.style.display = 'none';
                refreshApiStatus();
                addMessageToChat('system', '已切换至内置演示模式', false);
            } else {
                userKeyArea.style.display = 'flex';
                refreshApiStatus();
                const existing = customKeyInput.value.trim();
                if (!existing) {
                    updateKeyStatus('✏️ 请输入您的DeepSeek Key并保存', false);
                } else {
                    updateKeyStatus('⚡ 自定义Key待生效，点击保存', false);
                }
            }
            resetConversationHistory();
        }

        function init() {
            loadStoredKey();

            optBuiltin.addEventListener('click', () => {
                if (optBuiltin.querySelector('input').checked) switchApiMode('builtin');
            });
            optCustom.addEventListener('click', () => {
                if (optCustom.querySelector('input').checked) switchApiMode('custom');
            });
            saveKeyBtn.addEventListener('click', () => {
                if (applyCustomKey()) {
                    optCustom.querySelector('input').checked = true;
                    switchApiMode('custom');
                }
            });
            sendBtn.addEventListener('click', handleSendMessage);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !isWaitingResponse) {
                    e.preventDefault();
                    handleSendMessage();
                }
            });

            if (customKeyInput.value.trim()) {
                updateKeyStatus('检测到已保存的Key，可切换至自定义模式', false);
            } else {
                refreshApiStatus();
            }
            if (noMessagesDiv) {
                noMessagesDiv.innerHTML = '💬 选择API模式后即可开始对话<br>🔹 内置Key仅供体验，建议自备Key (获取: platform.deepseek.com)';
            }
            resetConversationHistory();
            userInput.focus();
        }

        init();
    </script>
</body>
</html>
