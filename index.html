<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网站导航</title>
    <link rel="icon" href="icon.jpeg">
    <link rel="stylesheet" href="res/style.css">
</head>

<body>
    <!-- 顶部导航 -->
    <header class="navbar">
        <div class="container">
            <nav class="nav-links">
                <a href="#" class="active">首页</a>
                <a href="#">收藏</a>
                <a href="#">关于</a>
            </nav>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container">
        <h1>常用网站导航</h1>

        <div class="card-grid">
            <a href="https://www.google.com" target="_blank" class="card-link">
                <div class="card">
                    <h3>Google</h3>
                    <p>全球广泛使用的搜索引擎，快速查找信息。</p>
                </div>
            </a>

            <a href="https://github.com" target="_blank" class="card-link">
                <div class="card">
                    <h3>GitHub</h3>
                    <p>代码托管与协作开发平台。</p>
                </div>
            </a>

            <a href="https://stackoverflow.com" target="_blank" class="card-link">
                <div class="card">
                    <h3>Stack Overflow</h3>
                    <p>程序员问答社区，解决技术难题。</p>
                </div>
            </a>

            <a href="https://www.zhihu.com" target="_blank" class="card-link">
                <div class="card">
                    <h3>知乎</h3>
                    <p>中文互联网高质量的问答社区。</p>
                </div>
            </a>

            <a href="https://www.bilibili.com" target="_blank" class="card-link">
                <div class="card">
                    <h3>Bilibili</h3>
                    <p>视频弹幕网站，学习 & 娱乐兼顾。</p>
                </div>
            </a>

            <a href="https://www.notion.so" target="_blank" class="card-link">
                <div class="card">
                    <h3>Notion</h3>
                    <p>一体化笔记与项目管理工具。</p>
                </div>
            </a>

            <a href="https://www.figma.com" target="_blank" class="card-link">
                <div class="card">
                    <h3>Figma</h3>
                    <p>在线 UI/UX 设计与协作平台。</p>
                </div>
            </a>

            <a href="https://www.dribbble.com" target="_blank" class="card-link">
                <div class="card">
                    <h3>Dribbble</h3>
                    <p>设计师作品展示与交流平台。</p>
                </div>
            </a>

            <a href="https://www.producthunt.com" target="_blank" class="card-link">
                <div class="card">
                    <h3>Product Hunt</h3>
                    <p>发现最新科技产品与创新工具。</p>
                </div>
            </a>

            <a href="https://www.wikipedia.org" target="_blank" class="card-link">
                <div class="card">
                    <h3>Wikipedia</h3>
                    <p>自由百科全书，海量知识资源。</p>
                </div>
            </a>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        © 2026 网站导航 · 简洁高效
    </footer>
</body>
</html>
